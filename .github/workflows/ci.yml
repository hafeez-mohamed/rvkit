name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { cc: gcc,   cxx: g++ }
          - { cc: clang, cxx: clang++ }
        preset: [debug, asan]
    name: ${{ matrix.compiler.cc }} / ${{ matrix.preset }}
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - uses: actions/checkout@v7
      - run: pipx install cmake && pipx install ninja
      - run: sudo apt-get update && sudo apt-get install -y ccache
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ matrix.compiler.cc }}-${{ matrix.preset }}-${{ github.run_id }}
          restore-keys: ccache-${{ matrix.compiler.cc }}-${{ matrix.preset }}-
      - run: ccache -z
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }}
      - run: ctest --preset ${{ matrix.preset }} --output-on-failure
      - run: ccache -s